<!doctype html>
<html><head><meta charset="utf-8"><title>AppIcon</title>
<style>
  html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
  /* macOS icon grid: 824px body with a 100px margin */
  .body{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:186px;
    background:linear-gradient(145deg,#F07A57 0%,#EC6644 45%,#D9472A 100%);
    box-shadow:0 18px 40px rgba(120,40,20,.28), inset 0 2px 0 rgba(255,255,255,.25)}
  .glow{position:absolute;inset:0;border-radius:186px;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
  .ring{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;border:64px solid #fff;box-sizing:border-box}
  .dot{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:#fff}
  .spark{position:absolute;right:170px;top:170px;width:92px;height:92px;border-radius:50%;background:#C5B7EE;box-shadow:0 0 0 18px rgba(197,183,238,.35)}
</style></head>
<body><div class="body"><div class="glow"></div><div class="ring"></div><div class="dot"></div><div class="spark"></div></div></body></html>
