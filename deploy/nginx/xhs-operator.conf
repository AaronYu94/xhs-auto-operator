# HTTPS entry for the console, installed by deploy/server/tls.sh as /etc/nginx/sites-available/xhs-operator.
# Self-signed certificate for the server's IP address; the desktop app pins its SHA-256 fingerprint.
# The app itself listens on 127.0.0.1:8080 only and runs with TRUST_PROXY=true.
server_tokens off;

server {
    # `listen … http2` form: Ubuntu 24.04 ships nginx 1.24, which predates the `http2 on;` directive
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/xhs-operator/tls/server.crt;
    ssl_certificate_key /etc/xhs-operator/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:xhs_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    # a few live Xiaohongshu actions (QR login, login checks) wait on a headless browser
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # the CSRF check compares Origin with Host, so pass the Host exactly as the client sent it
        proxy_set_header Host $http_host;
        # overwrite (never append) so clients cannot inject addresses into the login rate limiter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
