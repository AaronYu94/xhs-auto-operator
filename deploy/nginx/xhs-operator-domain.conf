# HTTPS entry for the console on a domain name, installed by deploy/server/domain.sh as
# /etc/nginx/sites-available/xhs-operator-domain. __DOMAIN__ is replaced at install time.
# The IP-address site (xhs-operator.conf, self-signed, pinned by the desktop app) stays the default server, so
# installed desktop apps keep working while browsers move to the domain.

# :80 answers only the ACME challenge and sends everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www is not a second address for the console: it redirects, so cookies and the CSRF origin check see one host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:xhs_tls:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    # a few live Xiaohongshu actions (QR login, login checks) wait on a headless browser
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # the CSRF check compares Origin with Host, so pass the Host exactly as the client sent it
        proxy_set_header Host $http_host;
        # overwrite (never append) so clients cannot inject addresses into the login rate limiter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
